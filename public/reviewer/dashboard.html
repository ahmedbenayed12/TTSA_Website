<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reviewer Dashboard – TTSA</title>
  <link rel="stylesheet" href="/css/global.css"/>
  <style>
    .assigned-card { transition: var(--transition); }
    .assigned-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .score-badge { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; font-weight: 700; font-size: .9rem; }
    .score-badge.pending { background: var(--gray-200); color: var(--gray-600); }
    .score-badge.graded { background: var(--blue); color: #fff; }
    .score-label { font-size: .75rem; color: var(--gray-500); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; text-align: center; }
  </style>
</head>
<body>
<div class="portal-layout">
  <aside class="sidebar sidebar-green">
    <div class="sidebar-logo">
      <img src="/img/logo.svg" alt="TTSA" onerror="this.style.display='none'"/>
      <div class="sidebar-logo-text"><div class="t1">Submission Portal</div><div class="t2">Reviewer Area</div></div>
    </div>
    <nav class="sidebar-nav">
      <a href="/reviewer/dashboard.html" class="active" style="justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg> Assignments List</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:#fff;"><circle cx="6" cy="15" r="4"/><circle cx="18" cy="15" r="4"/><path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/><path d="M21.5 13 19 7c-.7-1.3-1.4-2-3-2"/></svg>
        </div>
        <div class="sidebar-user-info">
          <div class="u-name"><span id="sidebarName">Loading…</span></div>
          <div class="u-role">Reviewer</div>
        </div>
      </div>
      <a href="#" onclick="logout()" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,0.12);color:#fff;font-weight:600;font-size:.82rem;border-radius:var(--radius-sm);margin-top:12px;text-decoration:none;transition:var(--transition);border:1px solid rgba(255,255,255,0.2);">Sign Out</a>
    </div>
  </aside>
  <main class="portal-main">
    <div class="portal-topbar">
      <h2>Assigned Abstracts</h2>
    </div>
    <div class="portal-body">
      
      <div class="stat-grid" style="margin-bottom:24px">
        <div class="stat-card">
          <div class="stat-label">Total Assigned</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Pending Review</div>
          <div class="stat-value" id="statPending" style="color:var(--warning)">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="statDone" style="color:var(--success)">—</div>
        </div>
      </div>

      <!-- Filter & Sort Toolbar -->
      <div class="card" style="margin-bottom:16px; padding:12px 18px; background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius);">
        <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;">
          
          <!-- Filters Group -->
          <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; flex:1; min-width:300px;">
            <!-- Search -->
            <div style="position:relative; min-width:170px; flex:1 1 170px; max-width:240px;">
              <input type="text" id="filterSearch" class="form-control" placeholder="Search title, topic, #..." style="padding:6px 10px 6px 30px; font-size:.83rem; height:34px;" oninput="applyFilters()"/>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:9px; top:10px; color:var(--gray-400); pointer-events:none;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>

            <!-- Type Filter -->
            <div style="display:flex; align-items:center; gap:5px;">
              <span style="font-size:.8rem; font-weight:600; color:var(--gray-500); white-space:nowrap;">Type:</span>
              <select id="typeFilter" class="form-control" style="width:130px; padding:4px 8px; font-size:.82rem; height:34px;" onchange="onTypeChange()">
                <option value="all">All Types</option>
                <option value="Oral">🎤 Oral</option>
                <option value="Poster">🖼 Poster</option>
                <option value="Video">🎬 Video</option>
              </select>
            </div>

            <!-- Sub-category / Topic Filter -->
            <div style="display:flex; align-items:center; gap:5px;">
              <span style="font-size:.8rem; font-weight:600; color:var(--gray-500); white-space:nowrap;">Sub-category:</span>
              <select id="topicFilter" class="form-control" style="min-width:170px; max-width:240px; padding:4px 8px; font-size:.82rem; height:34px;" onchange="applyFilters()">
                <option value="all">All Sub-categories</option>
              </select>
            </div>

            <!-- Status Filter -->
            <div style="display:flex; align-items:center; gap:5px;">
              <span style="font-size:.8rem; font-weight:600; color:var(--gray-500); white-space:nowrap;">Status:</span>
              <select id="statusFilter" class="form-control" style="width:140px; padding:4px 8px; font-size:.82rem; height:34px;" onchange="applyFilters()">
                <option value="all">All Reviews</option>
                <option value="pending">⏳ Pending</option>
                <option value="completed">✅ Completed</option>
                <option value="locked">🔒 Locked</option>
              </select>
            </div>

            <!-- Clear button -->
            <button class="btn btn-ghost btn-sm" id="btnResetFilters" onclick="resetFilters()" style="height:34px; padding:0 10px; font-size:.8rem; display:none;">✕ Clear</button>
          </div>

          <!-- Sort Controls & Count -->
          <div style="display:flex; align-items:center; gap:10px; margin-left:auto;">
            <div style="display:flex; align-items:center; gap:5px;">
              <span style="font-size:.8rem; font-weight:600; color:var(--gray-500); white-space:nowrap;">Sort by:</span>
              <select id="sortSelect" class="form-control" style="width:205px; padding:4px 8px; font-size:.82rem; height:34px;" onchange="applyFilters()">
                <option value="id_asc">ID (Oldest first)</option>
                <option value="id_desc">ID (Newest first)</option>
                <option value="type_oral_first">🎤 Oral First</option>
                <option value="type_poster_first">🖼 Poster First</option>
                <option value="type_video_first">🎬 Video First</option>
                <option value="topic_asc">Sub-category / Topic (A-Z)</option>
                <option value="title_asc">Title (A-Z)</option>
                <option value="score_desc">Score (Highest first)</option>
                <option value="score_asc">Score (Lowest first)</option>
              </select>
            </div>
            <span class="badge badge-gray" id="assignmentCountBadge" style="font-size:.78rem; padding:5px 9px; white-space:nowrap;">—</span>
          </div>

        </div>
      </div>

      <div class="card">
        <div class="card-header" style="display:flex; justify-content:space-between; align-items:center">
          <h3 style="margin:0">Assigned Abstracts List</h3>
        </div>
        <div class="card-body">
          <div id="assignmentsList" style="display:flex;flex-direction:column;gap:16px">
            <div class="loading-center"><div class="spinner"></div></div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>
<script src="/js/api.js"></script>
<script>
if (!requireAuth(['reviewer'])) throw '';

let allAssignments = [];
let displayedAssignments = [];

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadAssignments() {
  try {
    const [me, assignments] = await Promise.all([
      apiFetch('/auth/me'),
      apiFetch('/reviews/assigned')
    ]);

    document.getElementById('sidebarName').textContent = me.first_name + ' ' + me.last_name;

    const total = assignments.length;
    const done = assignments.filter(a => a.review_id != null).length;
    const pending = total - done;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statDone').textContent = done;

    allAssignments = assignments;
    populateTopicFilter('all');
    applyFilters();

  } catch (err) {
    console.error(err);
    showToast('Failed to load assignments', 'error');
  }
}

function populateTopicFilter(selectedType = 'all') {
  const select = document.getElementById('topicFilter');
  if (!select) return;
  const currentVal = select.value;
  select.innerHTML = '<option value="all">All Sub-categories</option>';

  const standardTopics = {
    'Oral': ['Chest Trauma', 'Hydatic Cyst'],
    'Poster': ['Thoracic Oncology', 'Other'],
    'Video': ['Video']
  };

  const topicsByType = { Oral: new Set(), Poster: new Set(), Video: new Set(), Other: new Set() };
  allAssignments.forEach(a => {
    const pref = a.preference || 'Other';
    const top = a.topic;
    if (top) {
      if (topicsByType[pref]) topicsByType[pref].add(top);
      else topicsByType.Other.add(top);
    }
  });

  Object.keys(standardTopics).forEach(p => {
    standardTopics[p].forEach(t => {
      if (topicsByType[p]) topicsByType[p].add(t);
    });
  });

  if (selectedType !== 'all') {
    const list = Array.from(topicsByType[selectedType] || []);
    list.sort().forEach(top => {
      const opt = document.createElement('option');
      opt.value = top;
      opt.textContent = top;
      select.appendChild(opt);
    });
  } else {
    ['Oral', 'Poster', 'Video', 'Other'].forEach(p => {
      const list = Array.from(topicsByType[p] || []);
      if (list.length > 0) {
        const grp = document.createElement('optgroup');
        grp.label = `${p==='Oral'?'🎤 Oral':p==='Poster'?'🖼 Poster':p==='Video'?'🎬 Video':'Other'} Sub-categories`;
        list.sort().forEach(top => {
          const opt = document.createElement('option');
          opt.value = top;
          opt.textContent = top;
          grp.appendChild(opt);
        });
        select.appendChild(grp);
      }
    });
  }

  if ([...select.options].some(o => o.value === currentVal)) {
    select.value = currentVal;
  } else {
    select.value = 'all';
  }
}

function onTypeChange() {
  const selectedType = document.getElementById('typeFilter').value;
  populateTopicFilter(selectedType);
  applyFilters();
}

function resetFilters() {
  document.getElementById('filterSearch').value = '';
  document.getElementById('typeFilter').value = 'all';
  document.getElementById('statusFilter').value = 'all';
  populateTopicFilter('all');
  document.getElementById('topicFilter').value = 'all';
  document.getElementById('sortSelect').value = 'id_asc';
  applyFilters();
}

function applyFilters() {
  const search = (document.getElementById('filterSearch').value || '').trim().toLowerCase();
  const type   = document.getElementById('typeFilter').value;
  const topic  = document.getElementById('topicFilter').value;
  const status = document.getElementById('statusFilter').value;
  const sort   = document.getElementById('sortSelect').value;

  const isFiltered = search !== '' || type !== 'all' || topic !== 'all' || status !== 'all';
  const resetBtn = document.getElementById('btnResetFilters');
  if (resetBtn) resetBtn.style.display = isFiltered ? 'inline-flex' : 'none';

  // 1. Filter
  displayedAssignments = allAssignments.filter(a => {
    // Search filter
    if (search) {
      const authorText = (a.authors && a.authors.length) ? a.authors.map(au => au.last_name + ' ' + au.first_name).join(' ') : '';
      const matchText = [
        a.title,
        a.topic,
        a.preference,
        a.submission_number ? `#${a.submission_number}` : '',
        `id:${a.id}`,
        authorText
      ].filter(Boolean).join(' ').toLowerCase();
      if (!matchText.includes(search)) return false;
    }

    // Type filter
    if (type !== 'all' && (a.preference || '').toLowerCase() !== type.toLowerCase()) {
      return false;
    }

    // Sub-category (topic) filter
    if (topic !== 'all') {
      const aTopic = (a.topic || '').toLowerCase();
      const targetTopic = topic.toLowerCase();
      if (targetTopic.includes('hydat') && aTopic.includes('hydat')) {
        // match
      } else if (targetTopic.includes('oncology') && aTopic.includes('oncology')) {
        // match
      } else if (aTopic !== targetTopic) {
        return false;
      }
    }

    // Status filter
    if (status === 'pending'   && a.review_id != null) return false;
    if (status === 'completed' && a.review_id == null) return false;
    if (status === 'locked'    && !a.review_locked)    return false;

    return true;
  });

  // 2. Sort
  displayedAssignments.sort((a, b) => {
    switch (sort) {
      case 'id_desc':
        return b.id - a.id;
      case 'id_asc':
        return a.id - b.id;
      case 'title_asc':
        return (a.title || '').localeCompare(b.title || '');
      case 'score_desc':
        return (b.total_score != null ? b.total_score : -1) - (a.total_score != null ? a.total_score : -1);
      case 'score_asc':
        return (a.total_score != null ? a.total_score : 999) - (b.total_score != null ? b.total_score : 999);
      case 'type_oral_first': {
        const order = { 'Oral': 1, 'Poster': 2, 'Video': 3 };
        const oA = order[a.preference] || 99;
        const oB = order[b.preference] || 99;
        if (oA !== oB) return oA - oB;
        return (a.topic || '').localeCompare(b.topic || '') || (a.id - b.id);
      }
      case 'type_poster_first': {
        const order = { 'Poster': 1, 'Oral': 2, 'Video': 3 };
        const oA = order[a.preference] || 99;
        const oB = order[b.preference] || 99;
        if (oA !== oB) return oA - oB;
        return (a.topic || '').localeCompare(b.topic || '') || (a.id - b.id);
      }
      case 'type_video_first': {
        const order = { 'Video': 1, 'Oral': 2, 'Poster': 3 };
        const oA = order[a.preference] || 99;
        const oB = order[b.preference] || 99;
        if (oA !== oB) return oA - oB;
        return (a.topic || '').localeCompare(b.topic || '') || (a.id - b.id);
      }
      case 'topic_asc': {
        const tA = (a.topic || '').toLowerCase();
        const tB = (b.topic || '').toLowerCase();
        if (tA !== tB) return tA.localeCompare(tB);
        return (a.preference || '').localeCompare(b.preference || '') || (a.id - b.id);
      }
      default:
        return a.id - b.id;
    }
  });

  // Update badge count
  const badge = document.getElementById('assignmentCountBadge');
  if (badge) {
    if (isFiltered) {
      badge.textContent = `Showing ${displayedAssignments.length} of ${allAssignments.length}`;
      badge.className = 'badge badge-blue';
    } else {
      badge.textContent = `Total: ${allAssignments.length}`;
      badge.className = 'badge badge-gray';
    }
  }

  renderAssignments();
}

function applySort() {
  applyFilters();
}

function renderAssignments() {
  const list = document.getElementById('assignmentsList');
  if (displayedAssignments.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📫</div><h3>No abstracts found</h3><p>No assigned abstracts match your search or filter criteria.</p></div>';
    return;
  }

  list.innerHTML = displayedAssignments.map(a => {
    const isDone   = a.review_id != null;
    const isLocked = !!a.review_locked;
    let authorStr = '';
    if (!a.blind && a.authors && a.authors.length) {
      authorStr = `<div style="font-size:.8rem;color:var(--gray-500);margin-bottom:8px">Authors: ${esc(a.authors.map(au=>au.last_name).join(', '))}</div>`;
    } else if (a.blind) {
      authorStr = `<div style="font-size:.8rem;color:var(--gray-500);margin-bottom:8px;display:flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Blind Review Mode Active</div>`;
    }

    const scoreHtml = isDone 
      ? `<div style="display:flex;flex-direction:column;align-items:center"><div class="score-badge graded">${a.total_score}</div><div class="score-label">/ 20</div></div>`
      : `<div style="display:flex;flex-direction:column;align-items:center"><div class="score-badge pending">-</div><div class="score-label">Pending</div></div>`;

    let verdictBadge = '';
    if (isDone) {
      if (a.verdict==='Admitted') verdictBadge = '<span class="badge badge-green" style="margin-top:8px">Admitted</span>';
      else verdictBadge = '<span class="badge badge-red" style="margin-top:8px">Refused</span>';
    }

    // Lock notice and action button
    const lockBanner = isLocked
      ? `<div style="display:flex;align-items:center;gap:6px;background:#e0f2f1;color:#00695c;border-radius:6px;padding:6px 10px;font-size:.78rem;font-weight:700;margin-bottom:10px">
           🔒 Review locked by administrator — no further submissions accepted
         </div>`
      : '';

    const actionBtn = isLocked
      ? `<div style="margin-top:16px;width:100%;text-align:center;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:7px 0;font-size:.78rem;font-weight:700;color:#64748b">🔒 Locked</div>`
      : `<a href="/reviewer/review.html?id=${a.id}" class="btn ${isDone?'btn-ghost':'btn-primary'} btn-sm" style="margin-top:16px;width:100%;justify-content:center">${isDone?'Edit Review':'Grade'}</a>`;

    const prefBadge = a.preference === 'Oral'
      ? '<span class="badge badge-blue" style="font-size:.7rem;padding:2px 7px;">🎤 Oral</span>'
      : a.preference === 'Poster'
        ? '<span class="badge badge-red" style="font-size:.7rem;padding:2px 7px;">🖼 Poster</span>'
        : a.preference === 'Video'
          ? '<span class="badge badge-purple" style="font-size:.7rem;padding:2px 7px;">🎬 Video</span>'
          : `<span class="badge badge-gray" style="font-size:.7rem;padding:2px 7px;">${esc(a.preference||'—')}</span>`;

    const cardBorder = isLocked ? 'var(--gray-200)' : (isDone ? 'var(--gray-200)' : 'var(--blue-light)');

    return `
      <div class="card assigned-card" style="border:1px solid ${cardBorder}${isLocked?' opacity:.85;':''}">
        <div class="card-body" style="display:flex;gap:20px;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;">
              ${a.submission_number ? `<span class="badge" style="background:#fff7ed;color:#c2410c;border:1px solid #f97316;">Abstract #${a.submission_number}</span>` : `<span class="badge badge-gray">ID: ${a.id}</span>`}
              <h4 style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.title)}</h4>
            </div>
            ${lockBanner}
            ${authorStr}
            <p style="font-size:.85rem;color:var(--gray-600);margin-bottom:12px;line-height:1.5;">${esc(a.main_text.substring(0,140))}...</p>
            <div style="display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--gray-500);flex-wrap:wrap;">
              ${prefBadge}
              <span style="font-weight:600;color:var(--gray-700)">${esc(a.topic||'—')}</span>
              <span style="color:var(--gray-400)">· ${a.word_count} words</span>
              ${a.presentation_type ? `<span style="margin-left:4px;font-weight:700;color:var(--gray-800);">· Pres: ${esc(a.presentation_type)}</span>` : ''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;min-width:100px;border-left:1px solid var(--gray-100);padding-left:20px">
            ${scoreHtml}
            ${verdictBadge}
            ${actionBtn}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

loadAssignments();
</script>
</body>
</html>
